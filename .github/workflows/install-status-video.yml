name: Load status and video module

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add status/video script to page
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/vccf-status-video.js"></script>'
          if tag not in s:
              marker='<script src="/vccf-config.js"></script>'
              if marker not in s:
                  raise SystemExit('config script marker not found')
              s=s.replace(marker, marker+'\n'+tag, 1)
              p.write_text(s,encoding='utf-8')
          else:
              print('status/video script already loaded')
      - name: Commit page change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load member status and dashboard video module'
          git push
