name: Integrate pledge module

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-pledges.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load pledge module in app shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="/vccf-pledges.css?v=20260904-1"><script src="/vccf-pledges.js?v=20260904-1"></script>'
          if marker in text:
              print('Pledge assets are already loaded.')
              raise SystemExit(0)

          anchor = '<link rel="stylesheet" href="/vccf-giving.css?v=20260903-3"><script src="/vccf-giving.js?v=20260903-4"></script>'
          if anchor not in text:
              raise SystemExit('Could not find the Giving module asset anchor in public/index.html')

          text = text.replace(anchor, anchor + marker, 1)
          path.write_text(text, encoding='utf-8')
          print('Pledge module assets added to public/index.html')
          PY
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then
            echo "No integration change needed."
            exit 0
          fi
          git config user.name "vccf-deployment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Load pledge module in VCCF app"
          git push origin HEAD:main
