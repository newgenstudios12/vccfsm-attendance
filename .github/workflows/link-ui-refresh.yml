name: Enable VCCF responsive UI refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link responsive UI stylesheet
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'VCCF_UI_REFRESH_V1'
          if marker in text:
              print('Responsive UI refresh already linked.')
              raise SystemExit(0)

          marker_html = '<!-- VCCF_UI_REFRESH_V1 -->'
          link = marker_html + '\n<link rel="stylesheet" href="/vccf-ui-refresh.css">'
          head_end = text.find('</head>')
          if head_end < 0:
              raise SystemExit('Could not find </head> in public/index.html')
          text = text[:head_end] + link + '\n' + text[head_end:]
          text = text.replace('<meta name="theme-color" content="#6d45e8">', '<meta name="theme-color" content="#d71920">')
          path.write_text(text, encoding='utf-8')

      - name: Commit responsive UI refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Polish VCCF responsive desktop and mobile UI'
          git push
