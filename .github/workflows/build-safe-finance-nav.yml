name: Build safe Finance navigation

on:
  push:
    branches: [safe-finance-navigation]
    paths:
      - '.github/workflows/build-safe-finance-nav.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4

      - name: Apply safe Finance navigation patch
        run: python3 .github/scripts/apply-safe-finance-nav.py

      - name: Validate JavaScript syntax
        run: |
          node --check public/vccf-app-shell-v2.js
          node --check public/vccf-band-fund.js

      - name: Commit isolated implementation
        run: |
          rm -f .github/workflows/build-safe-finance-nav.yml .github/scripts/apply-safe-finance-nav.py
          git config user.name "vccf-safe-nav-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/vccf-app-shell-v2.js public/vccf-band-fund.js public/index.html .github/workflows/build-safe-finance-nav.yml .github/scripts/apply-safe-finance-nav.py
          git commit -m "Add safe event-driven Finance navigation group"
          git push origin HEAD:safe-finance-navigation
