name: Link VCCF account-profile navigation script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link account/profile/navigation script
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'VCCF_ACCOUNT_PROFILE_NAV_V1'
          if marker in text:
              print('Account/profile navigation script already linked.')
              raise SystemExit(0)
          needle = '<script src="/vccf-member-controls.js"></script>'
          link = needle + '\n<!-- VCCF_ACCOUNT_PROFILE_NAV_V1 -->\n<script src="/vccf-account-profile-nav.js"></script>'
          if needle not in text:
              raise SystemExit('Could not find member controls script tag.')
          text = text.replace(needle, link, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit link
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Link account profile and navigation enhancement'
          git push
