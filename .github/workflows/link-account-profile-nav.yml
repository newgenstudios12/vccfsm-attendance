name: Link VCCF account-profile navigation script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link account/profile/navigation scripts
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          account_marker = 'VCCF_ACCOUNT_PROFILE_NAV_V1'
          account_tag = '<script src="/vccf-account-profile-nav.js"></script>'
          member_tag = '<script src="/vccf-member-controls.js"></script>'
          account_link = member_tag + '\n<!-- VCCF_ACCOUNT_PROFILE_NAV_V1 -->\n' + account_tag
          if account_marker not in text:
              if member_tag not in text:
                  raise SystemExit('Could not find member controls script tag.')
              text = text.replace(member_tag, account_link, 1)
          cleanup_marker = 'VCCF_NAV_CLEANUP_V1'
          cleanup_tag = '<script src="/vccf-navigation-cleanup.js"></script>'
          if cleanup_marker not in text:
              if account_tag not in text:
                  raise SystemExit('Could not find account profile navigation script tag.')
              text = text.replace(account_tag, account_tag + '\n<!-- VCCF_NAV_CLEANUP_V1 -->\n' + cleanup_tag, 1)
          login_marker = 'VCCF_FINAL_LOGIN_V1'
          login_tag = '<script src="/vccf-login-final.js"></script>'
          if login_marker not in text:
              cleanup_anchor = cleanup_tag
              if cleanup_anchor not in text:
                  raise SystemExit('Could not find navigation cleanup script tag.')
              text = text.replace(cleanup_anchor, cleanup_anchor + '\n<!-- VCCF_FINAL_LOGIN_V1 -->\n' + login_tag, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit link
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Link final login handler'
          git push
