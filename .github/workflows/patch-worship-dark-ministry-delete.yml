name: Patch Worship dark mode and ministry deletion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-worship-dark-ministry-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch_worship_dark_and_ministry_delete.py

      - name: Validate JavaScript
        run: |
          node --check public/vccf-worship-ministry.js
          node --check public/church-management.js
          grep -q 'data-delete-ministry' public/church-management.js
          grep -q 'vccf-worship-ministry.js?v=20260908-3' public/index.html
          grep -q 'church-management.js?v=20260908-1' public/index.html

      - name: Commit changes
        run: |
          if git diff --quiet -- public/vccf-worship-ministry.js public/church-management.js public/index.html; then
            exit 0
          fi
          git config user.name 'VCCF Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/vccf-worship-ministry.js public/church-management.js public/index.html
          git commit -m 'Fix Worship dark mode and allow ministry deletion'
          git push origin HEAD:main
