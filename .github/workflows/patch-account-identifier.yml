name: Patch account identifier

on:
  push:
    paths:
      - '.github/workflows/patch-account-identifier.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update account identifier field
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          old = '<label>Email</label><input id="aUser" type="email" required autocomplete="off">'
          new = '<label>E-mail/username</label><input id="aUser" type="text" required autocomplete="off">'
          if old not in s:
              raise SystemExit('Target account field was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patched account field
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Allow email or username when creating accounts'
          git push
