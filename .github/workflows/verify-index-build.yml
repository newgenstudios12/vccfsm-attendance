name: Verify VCCF index build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify authoritative login guard is in index
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          text=p.read_text(encoding='utf-8')
          if 'vccf-login-guard.js' not in text:
              raise SystemExit('Authoritative login guard is missing from public/index.html')
          marker='<!-- VCCF_INDEX_AUTH_GUARD_VERIFIED -->'
          if marker not in text:
              p.write_text(text.replace('</head>', marker+'\n</head>', 1), encoding='utf-8')
      - name: Commit verification marker
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(auth): verify login guard is present in production index'
          git push
