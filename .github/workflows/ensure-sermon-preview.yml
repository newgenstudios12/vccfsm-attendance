name: Ensure Sermon Preview is loaded

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inject preview script
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          t=p.read_text(encoding='utf-8')
          marker='VCCF_SERMON_PREVIEW_V1'
          if marker in t:
              print('Preview already loaded.')
              raise SystemExit(0)
          tag='  <!-- VCCF_SERMON_PREVIEW_V1 -->\n  <script src="/vccf-sermon-preview.js"></script>\n'
          end='</body>'
          if end not in t:
              raise SystemExit('index.html has no </body> marker')
          p.write_text(t.replace(end,tag+end,1),encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(pro): load sermon preview'
          git push origin main
