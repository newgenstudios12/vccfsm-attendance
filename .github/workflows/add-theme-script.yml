name: Add theme persistence script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Add account theme persistence script'
    steps:
      - uses: actions/checkout@v4
      - name: Add theme script and remove one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          marker = '<script src="/vccf-config.js"></script>'
          line = '<script src="/vccf-theme.js"></script>'
          if line not in s:
              if marker not in s:
                  raise SystemExit('Could not find vccf-config.js script tag')
              s = s.replace(marker, marker + '\n' + line, 1)
              p.write_text(s)
          Path('.github/workflows/add-theme-script.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html .github/workflows/add-theme-script.yml
          git commit -m 'Add account theme persistence script'
          git push
