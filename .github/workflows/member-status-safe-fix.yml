name: Apply member status visibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/member-status-safe-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch member status visibility safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/vccf-status-video.js')
          s=p.read_text()
          if 'async function enhanceOwnMemberStatus()' not in s:
              marker='  async function enhanceMembers(){'
              fn='''  async function enhanceOwnMemberStatus(){\n    const section=document.getElementById('members');if(!section)return;\n    const p=await profile();if(!p||roleName(p.role)==='admin'||roleName(p.role)==='area leader')return;\n    const memberId=p.member_id;if(!memberId)return;\n    const {data,error}=await supa.from('members').select('status').eq('id',memberId).maybeSingle();if(error||!data)return;\n    let panel=document.getElementById('memberOwnStatus');\n    if(!panel){panel=document.createElement('div');panel.id='memberOwnStatus';panel.style.cssText='margin:0 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:12px';section.prepend(panel)}\n    const inactive=String(data.status||'active').toLowerCase()==='inactive';\n    panel.innerHTML=`<div><b>My Status</b><div style="color:var(--muted);font-size:.82rem;margin-top:3px">Your current membership status</div></div><span style="font-weight:800" class="tag ${inactive?'danger':''}">${inactive?'Inactive':'Active'}</span>`;\n  }\n\n'''
              if marker not in s: raise SystemExit('enhanceMembers marker not found')
              s=s.replace(marker,fn+marker,1)
          old="if(document.getElementById('members')?.classList.contains('active')){if(typeof window.renderMembers==='function')window.renderMembers();await enhanceMembers()}"
          new="if(document.getElementById('members')?.classList.contains('active')){if(typeof window.renderMembers==='function')window.renderMembers();await enhanceMembers();await enhanceOwnMemberStatus()}"
          if old not in s: raise SystemExit('run marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit app change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vccf-status-video.js .github/workflows/member-status-safe-fix.yml
          git rm .github/workflows/member-status-safe-fix.yml
          git commit -m 'feat: show member active inactive status'
          git push origin main
