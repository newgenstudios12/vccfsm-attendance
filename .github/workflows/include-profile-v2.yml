name: Load My Profile v2
on:
  push:
    branches: [main]
    paths:
      - 'public/vccf-my-profile-v2.js'
      - 'public/vccf-stability-guard.js'
      - '.github/workflows/include-profile-v2.yml'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable profile modules are loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html');s=p.read_text(encoding='utf-8')
          for line in ['<script src="/vccf-my-profile.js"></script>','<script src="/vccf-profile-auto-link.js"></script>','<script src="/vccf-profile-member-view-fix.js"></script>']:
              s=s.replace('  '+line+'\n','').replace(line+'\n','')
          for tag in ['<script src="/vccf-my-profile-v2.js"></script>','<script src="/vccf-stability-guard.js"></script>']:
              if tag not in s:s=s.replace('</body>','  '+tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit profile loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(profile): keep stable profile modules'
          git push
