name: Load My Profile v2

on:
  push:
    branches: [main]
    paths:
      - 'public/vccf-my-profile-v2.js'
      - '.github/workflows/include-profile-v2.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(profile): load account profile v2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Ensure My Profile v2 is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/vccf-my-profile-v2.js"></script>'
          if '</body>' not in s:
              raise SystemExit('Could not find </body>')
          if tag not in s:
              s=s.replace('</body>',f'  {tag}\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then echo 'Already loaded'; else git commit -m 'chore(profile): load account profile v2'; git push; fi
