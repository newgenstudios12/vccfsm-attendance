name: Patch Worship Ministry navigation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-worship-nav-and-roles.yml
      - .github/scripts/patch_worship_nav_roles.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch_worship_nav_roles.py

      - name: Validate JavaScript
        run: |
          node --check public/vccf-worship-ministry.js
          grep -q "Creative Arts" public/vccf-worship-ministry.js
          grep -q "Existing Ministries" public/vccf-worship-ministry.js
          grep -q "finance.insertAdjacentElement('afterend',group)" public/vccf-worship-ministry.js
          grep -q 'vccf-worship-ministry.js?v=20260908-2' public/index.html

      - name: Commit changes
        run: |
          if git diff --quiet -- public/vccf-worship-ministry.js public/index.html; then
            exit 0
          fi
          git config user.name "VCCF Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/vccf-worship-ministry.js public/index.html
          git commit -m "Match Worship dropdown to Finance and sync ministry roles"
          git push origin HEAD:main
