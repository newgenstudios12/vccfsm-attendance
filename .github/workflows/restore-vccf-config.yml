name: Restore VCCF config safely

on:
  push:
    branches: [main]
    paths:
      - '.restore-vccf-config-trigger'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore vccf-config.js from known-good revision without changing the current API key
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_KEY=$(python - <<'PY'
          import re
          p='public/vccf-config.js'
          s=open(p,encoding='utf-8').read()
          m=re.search(r"window\.VCCF_SUPABASE_PUBLISHABLE_KEY\s*=\s*'([^']*)'",s)
          if not m:
              raise SystemExit('Current API key not found')
          print(m.group(1))
          PY
          )
          git show 593ca3f5cb82f00c509ee5026ed11d3d992c26e8:public/vccf-config.js > public/vccf-config.js
          python - "$CURRENT_KEY" <<'PY'
          import re,sys
          p='public/vccf-config.js'
          key=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          s=re.sub(r"window\.VCCF_SUPABASE_PUBLISHABLE_KEY\s*=\s*'[^']*'", "window.VCCF_SUPABASE_PUBLISHABLE_KEY = '"+key+"'", s, count=1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Commit restored config
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vccf-config.js
          if git diff --cached --quiet; then
            echo 'No config changes required.'
            exit 0
          fi
          git commit -m 'fix(auth): restore stable app config without changing API key'
          git push origin HEAD:main

      - name: Remove temporary restore workflow and trigger
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/restore-vccf-config.yml .restore-vccf-config-trigger || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'Temporary restore files already absent.'
            exit 0
          fi
          git commit -m 'chore: remove temporary config restore automation'
          git push origin HEAD:main
