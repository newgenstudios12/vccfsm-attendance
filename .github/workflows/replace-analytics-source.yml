name: Replace Analytics source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace legacy Analytics implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          suite = Path('public/vccf-suite.js')
          text = suite.read_text(encoding='utf-8')

          new_view = r'''wrap('analytics').innerHTML=`<div class="suite-shell"><div class="vccf-analytics-head"><div><div class="suite-muted">Leadership analytics</div><h3 style="margin:4px 0">Sunday Attendance Overview</h3><div class="suite-muted">Sunday attendance only · latest 8 Sundays</div></div><div class="suite-actions"><select id="suiteAnalyticsRange" class="search" aria-label="Analytics range"><option value="8">Last 8 Sundays</option></select></div></div><div id="suiteAnalyticsBody"></div></div>`;'''
          pattern = r"wrap\('analytics'\)\.innerHTML=`.*?`;\nwrap\('events'\)"
          updated, count = re.subn(pattern, new_view + "\nwrap('events')", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Legacy Analytics view block not found')
          text = updated

          new_render = r'''function renderAnalytics(){
 const body=$('suiteAnalyticsBody');if(!body)return;
 const fmtDay=v=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v));
 const labels=[];const now=new Date();const today=fmtDay(now);const cursor=new Date(`${today}T12:00:00+08:00`);cursor.setDate(cursor.getDate()-cursor.getDay());
 for(let i=7;i>=0;i--){const d=new Date(cursor);d.setDate(cursor.getDate()-i*7);labels.push(fmtDay(d));}
 const labelText=d=>new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',month:'short',day:'numeric'}).format(new Date(`${d}T12:00:00+08:00`));
 const scoped=S.members;const ids=new Set(scoped.map(x=>x.id));const scopedAtt=S.attendance.filter(a=>ids.has(a.member_id));
 const seenBySunday=labels.map(day=>{const idsForDay=new Set();scopedAtt.forEach(a=>{if(fmtDay(a.checked_in_at)===day)idsForDay.add(String(a.member_id));});return idsForDay.size;});
 const total=scoped.length;const active=scoped.filter(m=>m.status==='active'||m.is_active!==false).length;const inactive=Math.max(0,total-active);const avg=seenBySunday.reduce((a,b)=>a+b,0)/labels.length;const latest=labels[labels.length-1];
 const areaRows=S.areas.filter(a=>scoped.some(m=>m.area_id===a.id)).map(a=>{const members=scoped.filter(m=>m.area_id===a.id);const memberIds=new Set(members.map(m=>String(m.id)));const present=new Set(scopedAtt.filter(x=>memberIds.has(String(x.member_id))&&fmtDay(x.checked_in_at)===latest).map(x=>String(x.member_id)));return{area:a.name,total:members.length,present:present.size,rate:members.length?Math.round(present.size/members.length*100):0};});
 const max=Math.max(1,...seenBySunday);
 body.innerHTML=`<div class="suite-kpis"><div class="suite-kpi"><small>Total members</small><strong>${total}</strong><span class="suite-muted">Members in scope</span></div><div class="suite-kpi"><small>Active</small><strong>${active}</strong><span class="suite-muted">Attendance in the last 4 Sundays</span></div><div class="suite-kpi"><small>Inactive</small><strong>${inactive}</strong><span class="suite-muted">No attendance in the last 4 Sundays</span></div><div class="suite-kpi"><small>Avg check-ins / week</small><strong>${avg.toFixed(1)}</strong><span class="suite-muted">Across the last 8 Sundays</span></div></div><section class="suite-card vccf-analytics-panel"><div><h3 style="margin:0 0 4px">Sunday Attendance Overview</h3><div class="suite-muted">Attendance by Sunday · ${labelText(latest)} is the latest</div></div><div class="vccf-analytics-chart"><div class="vccf-analytics-plot"><span class="vccf-gridline" style="top:0"></span><span class="vccf-gridline" style="top:25%"></span><span class="vccf-gridline" style="top:50%"></span><span class="vccf-gridline" style="top:75%"></span>${seenBySunday.map(v=>{const h=Math.max(3,Math.round(v/max*250));return `<div class="vccf-analytics-column"><span class="vccf-analytics-value">${v}</span><span class="vccf-analytics-bar" style="height:${h}px"></span></div>`}).join('')}</div><div class="vccf-analytics-labels">${labels.map(d=>`<span>${labelText(d)}</span>`).join('')}</div><div class="vccf-analytics-legend"><span></span>Sunday attendance</div></div></section><section class="suite-card vccf-analytics-panel"><div><h3 style="margin:0 0 4px">Area Performance</h3><div class="suite-muted">Check-in performance for the latest Sunday · ${labelText(latest)}</div></div><div class="vccf-area-grid">${areaRows.length?areaRows.map(r=>`<div class="vccf-area-card"><div class="suite-toolbar"><b>${esc(r.area)}</b><b>${r.rate}%</b></div><div class="suite-progress"><span style="width:${r.rate}%"></span></div><div class="suite-muted" style="margin-top:6px">${r.present} of ${r.total} members checked in</div></div>`).join(''):'<div class="suite-empty">No areas available.</div>'}</div></section>`;
 if($('suiteAnalyticsRange'))$('suiteAnalyticsRange').onchange=renderAnalytics;
}
function renderEvents()'''
          text, count = re.subn(r"function renderAnalytics\(\)\{.*?\nfunction renderEvents\(\)", new_render, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Legacy renderAnalytics function not found')
          suite.write_text(text, encoding='utf-8')

          css = Path('public/vccf-suite.css')
          c = css.read_text(encoding='utf-8')
          c = re.sub(r"\.suite-heatmap\{[^}]*\}\.suite-heat\{[^}]*\}\.suite-heat\[data-level=\"1\"\]\{[^}]*\}\.suite-heat\[data-level=\"2\"\]\{[^}]*\}\.suite-heat\[data-level=\"3\"\]\{[^}]*\}\.suite-heat\[data-level=\"4\"\]\{[^}]*\}", "", c)
          c = re.sub(r"\n  \.suite-heatmap\{[^}]*\}", "", c)
          additions = r'''
.vccf-analytics-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}.vccf-analytics-panel{display:block}.vccf-analytics-chart{margin-top:22px}.vccf-analytics-plot{position:relative;height:320px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px;align-items:end;padding:0 12px;border-bottom:1px solid var(--line)}.vccf-gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--line);opacity:.55}.vccf-analytics-column{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}.vccf-analytics-value{margin-bottom:6px;font-size:.72rem;font-weight:900}.vccf-analytics-bar{width:min(48px,72%);min-height:3px;border-radius:8px 8px 2px 2px;background:var(--brand-gradient)}.vccf-analytics-labels{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px;padding:10px 12px 0}.vccf-analytics-labels span{text-align:center;white-space:nowrap;color:var(--muted);font-size:.66rem}.vccf-analytics-legend{display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-top:13px;color:var(--muted);font-size:.7rem}.vccf-analytics-legend span{width:10px;height:10px;border-radius:3px;background:var(--brand-gradient)}.vccf-area-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.vccf-area-card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px}
@media(max-width:900px){.vccf-area-grid{grid-template-columns:1fr}}@media(max-width:600px){.vccf-analytics-plot{height:250px;gap:7px;padding:0 4px}.vccf-analytics-labels{gap:7px;padding-left:4px;padding-right:4px}.vccf-analytics-labels span{font-size:.56rem}}
'''
          if '.vccf-analytics-head{' not in c:
              c += additions
          css.write_text(c, encoding='utf-8')

          index = Path('public/index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('<script src="/vccf-analytics-status-fix.js"></script>\n','')
          index.write_text(h, encoding='utf-8')

          old = Path('public/vccf-analytics-status-fix.js')
          if old.exists(): old.unlink()

      - name: Remove analytics installer workflow
        shell: bash
        run: rm -f .github/workflows/install-analytics-status-fix.yml

      - name: Commit source replacement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vccf-suite.js public/vccf-suite.css public/index.html
          git rm --cached --ignore-unmatch public/vccf-analytics-status-fix.js || true
          git add -u public/vccf-analytics-status-fix.js .github/workflows/install-analytics-status-fix.yml || true
          git commit -m 'refactor: remove legacy analytics and build Sunday dashboard' || exit 0
          git push
