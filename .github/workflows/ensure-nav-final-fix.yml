name: Ensure resilient navigation fix is loaded

on:
  push:
    branches: [main]
    paths:
      - 'public/vccf-nav-final-fix.js'
      - '.github/workflows/ensure-nav-final-fix.yml'

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(nav):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inject resilient navigation script
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          t=p.read_text(encoding='utf-8')
          marker='VCCF_NAV_FINAL_FIX_V1'
          if marker in t:
              print('Final navigation fix already loaded.')
              raise SystemExit(0)
          tag='  <!-- VCCF_NAV_FINAL_FIX_V1 -->\n  <script src="/vccf-nav-final-fix.js"></script>\n'
          end='</body>'
          if end not in t:
              raise SystemExit('index.html has no </body> marker')
          p.write_text(t.replace(end,tag+end,1),encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(nav): load resilient final navigation fix'
          git push origin main
