name: Remove duplicate My Profile navigation tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link duplicate profile cleanup script
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'VCCF_REMOVE_DUPLICATE_PROFILE_V1'
          if marker in text:
              print('Duplicate profile cleanup already linked.')
              raise SystemExit(0)
          needle = '<script src="/vccf-account-profile-nav.js"></script>'
          if needle not in text:
              raise SystemExit('Could not find account profile navigation script.')
          replacement = needle + '\n<!-- VCCF_REMOVE_DUPLICATE_PROFILE_V1 -->\n<script src="/vccf-remove-duplicate-profile.js"></script>'
          text = text.replace(needle, replacement, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit profile cleanup link
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Link duplicate My Profile cleanup'
          git push
