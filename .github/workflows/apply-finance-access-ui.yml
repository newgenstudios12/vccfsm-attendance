name: Apply finance access UI

on:
  push:
    branches: [finance-access-ministry]
    paths:
      - '.github/workflows/apply-finance-access-ui.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply access patch
        run: python3 .github/scripts/apply-finance-access-ui.py

      - name: Validate JavaScript syntax
        run: |
          node --check public/vccf-app-shell-v2.js
          node --check public/vccf-giving.js
          node --check public/vccf-pledges.js

      - name: Commit isolated implementation
        run: |
          rm -f .github/workflows/apply-finance-access-ui.yml .github/scripts/apply-finance-access-ui.py
          git config user.name "vccf-finance-access-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/vccf-app-shell-v2.js public/vccf-giving.js public/vccf-pledges.js public/index.html .github/workflows/apply-finance-access-ui.yml .github/scripts/apply-finance-access-ui.py
          git commit -m "Restrict Finance modules to authorized roles and Treasurer ministry"
          git push origin HEAD:finance-access-ministry
