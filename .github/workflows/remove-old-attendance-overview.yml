name: Remove old attendance overview
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: replace old attendance overview' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace old overview with Sunday graph
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/vccf-status-video.js')
          s=p.read_text()
          marker="    const section=document.getElementById('analytics')||document.querySelector('[data-view=\"analytics\"]');if(!section)return;"
          old="""    const section=document.getElementById('analytics')||document.querySelector('[data-view=\"analytics\"]');if(!section)return;\n    const p=await profile();if(!p)return;"""
          new="""    const section=document.getElementById('analytics')||document.querySelector('[data-view=\"analytics\"]');if(!section)return;\n    const oldOverview=[...section.querySelectorAll('.panel')].find(x=>!x.id && /Attendance Overview/i.test(x.textContent||''));\n    oldOverview?.remove();\n    const p=await profile();if(!p)return;"""
          if old not in s: raise SystemExit('analytics function not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/remove-old-attendance-overview.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/vccf-status-video.js .github/workflows/remove-old-attendance-overview.yml
          git commit -m "fix: replace old attendance overview"
          git push
