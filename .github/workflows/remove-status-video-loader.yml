name: Remove legacy status video loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy loader from index
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/vccf-status-video.js"></script>\n'
          if tag in s:
              p.write_text(s.replace(tag, ''), encoding='utf-8')
          else:
              print('Legacy loader already removed')
      - name: Commit page cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: remove legacy analytics renderer from page'
          git push
