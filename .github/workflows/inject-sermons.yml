name: Ensure Sermons is loaded

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci: ensure sermons is loaded') && !startsWith(github.event.head_commit.message, 'chore(pro): load production UX suite') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inject Sermons and UI behavior scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="/vccf-sermons.js"></script>',
              '<script src="/vccf-ui-behavior-fixes.js"></script>',
              '<script src="/vccf-chat-messenger.js"></script>',
          ]
          marker='</body>'
          if marker not in s:
              raise SystemExit('index.html has no </body> marker')
          changed=False
          for tag in tags:
              if tag not in s:
                  s=s.replace(marker, '  '+tag+'\n'+marker, 1)
                  changed=True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Injected missing Sermons/UI/chat behavior modules.')
          else:
              print('Sermons/UI/chat behavior modules already loaded.')
          PY
      - name: Commit injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'chore(pro): load sermons and messenger chat module'
            git push origin main
          fi
