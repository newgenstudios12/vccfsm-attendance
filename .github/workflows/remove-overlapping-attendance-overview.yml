name: Remove overlapping attendance overview
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: remove overlapping attendance overview' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate overview panel
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/vccf-status-video.js')
          s=p.read_text()
          old='''    const section=document.getElementById('analytics')||document.querySelector('[data-view="analytics"]');if(!section)return;\n    const p=await profile();if(!p)return;'''
          new='''    const section=document.getElementById('analytics')||document.querySelector('[data-view="analytics"]');if(!section)return;\n    const oldOverview=[...section.querySelectorAll('.panel')].find(x=>!x.id && /Attendance Overview/i.test(x.textContent||''));\n    oldOverview?.remove();\n    const p=await profile();if(!p)return;'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/vccf-status-video.js .github/workflows/remove-overlapping-attendance-overview.yml
          git commit -m "fix: remove overlapping attendance overview"
          git push
          rm -f .github/workflows/remove-overlapping-attendance-overview.yml
          git add .github/workflows/remove-overlapping-attendance-overview.yml
          git commit -m "chore: remove one-time attendance overview patch"
          git push
