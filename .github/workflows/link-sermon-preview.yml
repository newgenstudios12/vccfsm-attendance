name: Link Sermon Preview

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Link Sermon preview module
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          t=p.read_text(encoding='utf-8')
          marker='VCCF_SERMON_PREVIEW_V1'
          if marker in t:
              print('Sermon preview already linked.')
              raise SystemExit(0)
          needle='<script src="/vccf-sermons.js"></script>'
          if needle not in t:
              raise SystemExit('Sermons module script tag was not found.')
          replacement=needle+'\n<!-- VCCF_SERMON_PREVIEW_V1 -->\n<script src="/vccf-sermon-preview.js"></script>'
          t=t.replace(needle,replacement,1)
          p.write_text(t,encoding='utf-8')
      - name: Commit preview link
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add preview option for sermons'
          git push origin main
