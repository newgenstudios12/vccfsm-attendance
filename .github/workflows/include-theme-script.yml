name: Include theme persistence script

on:
  push:
    branches: [main]
    paths:
      - 'public/vccf-theme.js'
      - 'public/index.html'
      - '.github/workflows/include-theme-script.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(theme):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure theme script is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/vccf-theme.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in public/index.html')
              s = s.replace(marker, f'  {tag}\n{marker}', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit theme script inclusion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo 'Theme script already included.'
          else
            git commit -m 'chore(theme): load per-account theme persistence'
            git push
          fi
