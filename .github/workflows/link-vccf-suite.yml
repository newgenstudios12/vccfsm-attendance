name: Link VCCF feature suite
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link feature suite
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          t=p.read_text(encoding='utf-8')
          marker='VCCF_FEATURE_SUITE_V1'
          if marker in t:
              print('Feature suite already linked.')
              raise SystemExit(0)
          head=t.find('</head>')
          if head<0: raise SystemExit('No head end found')
          add='''<!-- VCCF_FEATURE_SUITE_V1 -->\n<link rel="manifest" href="/manifest.webmanifest">\n<link rel="stylesheet" href="/vccf-suite.css">\n<script src="/vccf-suite.js" defer></script>\n'''
          t=t[:head]+add+t[head:]
          p.write_text(t,encoding='utf-8')
      - name: Commit feature suite link
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable VCCF feature suite and PWA'
          git push
