name: Normalize app shell once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(shell): normalize duplicate script tags') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate exact script tags
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('public/index.html')
          text = p.read_text(encoding='utf-8')
          seen = set()
          pattern = re.compile(r'(^[ \t]*<script\s+src="([^"]+)"(?:\s+[^>]*)?>\s*</script>\s*$)', re.MULTILINE)
          lines = text.splitlines(True)
          out = []
          for line in lines:
              m = pattern.match(line)
              if not m:
                  out.append(line)
                  continue
              src = m.group(2)
              if src in seen:
                  continue
              seen.add(src)
              out.append(line)
          normalized = ''.join(out)
          p.write_text(normalized, encoding='utf-8')
      - name: Commit normalized shell
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(shell): normalize duplicate script tags'
          git push origin main
