name: One-time fix public leadership admin mount

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-public-leadership-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch admin mount guard
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/vccf-public-leadership-admin.js')
          s=p.read_text()
          old="let rows=[],loading=false;"
          new="let rows=[],loading=false,observerStarted=false;"
          if old in s and 'observerStarted=false' not in s:
              s=s.replace(old,new,1)
          old="function tryMount(){if(!isAdmin())return;const panel=findLeadershipPanel();if(!panel)return;void load()}"
          new="function tryMount(){if(!isAdmin())return;const panel=findLeadershipPanel();if(!panel)return;if(document.getElementById('vccfPublicLeaderPanel'))return;if(rows.length)render();else void load()}"
          if old not in s:
              raise SystemExit('tryMount marker not found')
          s=s.replace(old,new,1)
          old="function init(){styles();tryMount();const c=document.getElementById('cmsContent');if(c)new MutationObserver(()=>tryMount()).observe(c,{childList:true,subtree:true});else new MutationObserver(()=>{const x=document.getElementById('cmsContent');if(x){new MutationObserver(()=>tryMount()).observe(x,{childList:true,subtree:true});tryMount()}}).observe(document.body,{childList:true,subtree:true})}"
          new="function init(){styles();tryMount();if(observerStarted)return;observerStarted=true;const c=document.getElementById('cmsContent');if(c)new MutationObserver(()=>tryMount()).observe(c,{childList:true,subtree:true});else new MutationObserver(()=>{const x=document.getElementById('cmsContent');if(x){new MutationObserver(()=>tryMount()).observe(x,{childList:true,subtree:true});tryMount()}}).observe(document.body,{childList:true,subtree:true})}"
          if old not in s:
              raise SystemExit('init marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vccf-public-leadership-admin.js
          git commit -m "Prevent repeated public leadership admin reloads"
          git push origin main
