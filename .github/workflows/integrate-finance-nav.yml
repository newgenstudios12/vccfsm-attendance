name: Integrate Finance navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-finance-nav.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load Finance navigation organizer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          text = p.read_text()
          needle = '<link rel="stylesheet" href="/vccf-pledges.css?v=20260904-1"><script src="/vccf-pledges.js?v=20260904-1"></script>'
          replacement = needle + '<script src="/vccf-finance-nav.js?v=20260904-1"></script>'
          if '/vccf-finance-nav.js' not in text:
              if needle not in text:
                  raise SystemExit('Pledge asset marker not found')
              text = text.replace(needle, replacement, 1)
              p.write_text(text)
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "vccf-deployment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Load Finance navigation dropdown"
          git push

# One-time integration trigger.
