name: Include Pro UX suite

on:
  push:
    branches: [main]
    paths:
      - 'public/vccf-pro-suite.js'
      - 'public/vccf-my-profile.js'
      - 'public/vccf-my-profile-v2.js'
      - 'public/vccf-chat.js'
      - 'public/vccf-chat-v2.js'
      - 'public/vccf-sermons.js'
      - 'public/vccf-profile-auto-link.js'
      - 'public/vccf-profile-member-view-fix.js'
      - 'public/vccf-church-management-suite.js'
      - 'public/vccf-church-management-suite-patch.js'
      - 'public/index.html'
      - '.github/workflows/include-pro-suite.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pro):') && !startsWith(github.event.head_commit.message, 'chore(suite):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure VCCF modules are loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  <script src="/vccf-chat.js"></script>\n', '')
          s = s.replace('  <script src="/vccf-chat-v2.js"></script>\n', '')
          tags = [
              '<script src="/vccf-pro-suite.js"></script>',
              '<script src="/vccf-my-profile.js"></script>',
              '<script src="/vccf-my-profile-v2.js"></script>',
              '<script src="/vccf-profile-auto-link.js"></script>',
              '<script src="/vccf-profile-member-view-fix.js"></script>',
              '<script src="/vccf-chat-v2.js"></script>',
              '<script src="/vccf-sermons.js"></script>',
              '<script src="/vccf-church-management-suite.js"></script>',
              '<script src="/vccf-church-management-suite-patch.js"></script>',
          ]
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Could not find </body> in public/index.html')
          changed = False
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, f'  {tag}\n{marker}', 1)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit module inclusion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo 'Modules already included.'
          else
            git commit -m 'chore(suite): load church management suite'
            git push
          fi
