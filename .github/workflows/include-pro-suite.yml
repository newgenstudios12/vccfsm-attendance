name: Include Pro UX suite

on:
  push:
    branches: [main]
    paths:
      - 'public/vccf-pro-suite.js'
      - 'public/index.html'
      - '.github/workflows/include-pro-suite.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pro):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure Pro UX suite is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/vccf-pro-suite.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in public/index.html')
              s = s.replace(marker, f'  {tag}\n{marker}', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit Pro UX suite inclusion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo 'Pro UX suite already included.'
          else
            git commit -m 'chore(pro): load production UX suite'
            git push
          fi
