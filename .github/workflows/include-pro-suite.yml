name: Include Pro UX suite

on:
  push:
    branches: [main]
    paths:
      - 'public/vccf-pro-suite.js'
      - 'public/vccf-my-profile.js'
      - 'public/my-profile-v2.js'
      - 'public/vccf-my-profile-v2.js'
      - 'public/chat.js'
      - 'public/vccf-chat.js'
      - 'public/vccf-chat-v2.js'
      - 'public/vccf-sermons.js'
      - 'public/vccf-sermons-guard.js'
      - 'public/vccf-navigation-cleanup.js'
      - 'public/vccf-profile-auto-link.js'
      - 'public/vccf-profile-member-view-fix.js'
      - 'public/index.html'
      - '.github/workflows/include-pro-suite.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pro):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Ensure VCCF modules are loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          remove=[
            '/vccf-chat.js','/vccf-my-profile.js','/vccf-chat-v2.js',
            '/vccf-sermons.js','/vccf-sermons-guard.js','/vccf-navigation-cleanup.js',
            '/vccf-pro-suite.js','/vccf-my-profile-v2.js',
            '/vccf-profile-auto-link.js','/vccf-profile-member-view-fix.js'
          ]
          for src in remove:
            s=re.sub(r'\s*<script[^>]+src=["\']'+re.escape(src)+r'["\'][^>]*></script>\s*','\n',s)
          tags=[
            '<script src="/vccf-pro-suite.js"></script>',
            '<script src="/vccf-my-profile-v2.js"></script>',
            '<script src="/vccf-profile-auto-link.js"></script>',
            '<script src="/vccf-profile-member-view-fix.js"></script>',
            '<script src="/vccf-chat-v2.js"></script>',
            '<script src="/vccf-sermons.js"></script>',
            '<script src="/vccf-sermons-guard.js"></script>',
            '<script src="/vccf-navigation-cleanup.js"></script>',
          ]
          marker='</body>'
          if marker not in s: raise SystemExit('Could not find </body>')
          for tag in tags:
            if tag not in s: s=s.replace(marker,'  '+tag+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit module inclusion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then echo 'Modules already canonical.'; else git commit -m 'chore(pro): canonicalize production modules'; git push; fi
