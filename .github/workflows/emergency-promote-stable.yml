name: Emergency Promote Stable VCCF Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Promote stable pre-regression deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote https://vccfsm-attendance-nt4dtkr0n-newgenstudios12s-projects.vercel.app --yes --token="$VERCEL_TOKEN"
