name: Prevent config from overwriting login handler

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login handler ownership
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/vccf-config.js')
          text=p.read_text(encoding='utf-8')
          marker='VCCF_LOGIN_HANDLER_OWNERSHIP_V1'
          if marker in text:
              raise SystemExit(0)
          needle="const form = document.getElementById('loginForm');\n    if (!form) return;"
          replacement="const form = document.getElementById('loginForm');\n    if (!form) return;\n    /* VCCF_LOGIN_HANDLER_OWNERSHIP_V1: never overwrite a handler already installed by index/guard. */\n    if (form.onsubmit) return;"
          if needle not in text:
              raise SystemExit('Login handler anchor not found')
          p.write_text(text.replace(needle,replacement,1),encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vccf-config.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(auth): stop config compatibility layer from overwriting login'
          git push
