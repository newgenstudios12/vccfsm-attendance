name: One-time wire public leadership

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-wire-public-leadership.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire leadership scripts
        shell: python
        run: |
          from pathlib import Path

          guest = Path('public/guest.html')
          s = guest.read_text()
          marker = '<script src="/vccf-public-event-policy.js?v=20260906-2"></script>'
          add = marker + '\n<script src="/vccf-public-orgchart.js?v=20260908-1"></script>'
          if '/vccf-public-orgchart.js?' not in s:
              if marker not in s:
                  raise SystemExit('guest marker not found')
              s = s.replace(marker, add, 1)
              guest.write_text(s)

          index = Path('public/index.html')
          s = index.read_text()
          marker = '<script src="/church-management.js?v=20260908-1"></script>'
          add = marker + '<script src="/vccf-public-leadership-admin.js?v=20260908-1"></script><script src="/vccf-leader-user-profile.js?v=20260908-1"></script>'
          if '/vccf-public-leadership-admin.js?' not in s:
              if marker not in s:
                  raise SystemExit('index marker not found')
              s = s.replace(marker, add, 1)
              index.write_text(s)
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guest.html public/index.html
          git commit -m "Load public leadership org chart and profile tools"
          git push origin main
