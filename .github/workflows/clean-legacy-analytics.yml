name: Clean legacy analytics renderer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy status/video loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script src="/vccf-status-video.js"></script>\n', '')
          p.write_text(s, encoding='utf-8')
      - name: Remove this one-shot workflow
        run: rm -f .github/workflows/clean-legacy-analytics.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html .github/workflows/clean-legacy-analytics.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: remove legacy analytics renderer from page'
          git push
