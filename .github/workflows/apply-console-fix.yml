name: Apply console/auth fix
on:
  push:
    paths:
      - '.github/workflows/apply-console-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          marker='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          singleton='<script src="/vccf-supabase-singleton.js"></script>'
          if singleton not in s:
              s=s.replace(marker, marker+'\n'+singleton, 1)
          s=s.replace('\n<script src="/vccf-login-guard.js"></script>\n<script src="/vccf-login-guard.js"></script>\n<script src="/vccf-login-guard.js"></script>\n<script src="/vccf-login-guard.js"></script>', '\n<script src="/vccf-login-guard.js"></script>', 1)
          p.write_text(s)
          PY
      - name: Remove one-shot patch workflow
        run: rm -f .github/workflows/apply-console-fix.yml
      - name: Commit patched bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html .github/workflows/apply-console-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: load Supabase singleton before app bootstrap'
          git push
