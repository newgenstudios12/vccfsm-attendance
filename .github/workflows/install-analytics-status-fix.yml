name: Load analytics status fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add analytics status script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          marker='<script src="/vccf-member-ui.js"></script>'
          tag='<script src="/vccf-analytics-status-fix.js"></script>'
          if tag not in s:
              if marker not in s:
                  raise SystemExit('member UI marker not found')
              s=s.replace(marker,marker+'\n'+tag,1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet || (git commit -m 'Load analytics status fix' && git push)
