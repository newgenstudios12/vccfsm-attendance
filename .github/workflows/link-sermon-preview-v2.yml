name: Link corrected Sermon preview

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  link:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: link corrected sermon preview') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link preview module
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/vccf-sermon-preview-v2.js"></script>'
          if tag not in s:
              s=s.replace('</body>', '  '+tag+'\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Preview module already linked.')
      - name: Commit link
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: link corrected sermon preview'
          git push origin main
