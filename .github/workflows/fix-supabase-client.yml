name: Fix Supabase client global collision

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-client-name:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Rename the page-local Supabase client
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          start = text.rfind('\n<script>\nconst { createClient } = window.supabase;')
          end = text.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('Could not locate the inline application script.')

          block = text[start:end]
          fixed = block.replace(
              'const supabase = createClient(',
              'const supabaseClient = createClient('
          )
          fixed = re.sub(r'(?<!window\\.)\\bsupabase\\.', 'supabaseClient.', fixed)

          if fixed == block:
              print('No change needed.')
          else:
              path.write_text(text[:start] + fixed + text[end:], encoding='utf-8')
              print('Renamed page-local Supabase client references.')

      - name: Commit fix if needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix Supabase client global name collision'
          git push