name: Apply VCCF login background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep login handler authoritative
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'VCCF_LOGIN_GUARD_V1'
          if marker not in text:
              tag = '<script src="/vccf-login-guard.js"></script>'
              anchor = '<script src="/vccf-config.js"></script>'
              if anchor not in text:
                  raise SystemExit('Could not find VCCF config script tag')
              text = text.replace(anchor, anchor + '\n' + tag, 1)

          bg_marker = 'VCCF_LOGIN_BACKGROUND_V1'
          if bg_marker not in text:
              style = '''<style id="VCCF_LOGIN_BACKGROUND_V1">\n.login{background:linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,.16)),url('/Churchfront_login.png') center center/cover no-repeat;}\n[data-theme="dark"] .login{background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)),url('/Churchfront_login.png') center center/cover no-repeat;}\n.login-card{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}\n@media(max-width:600px){.login{background-position:center center;background-attachment:scroll;padding:16px;}.login-card{width:100%;padding:24px;border-radius:22px;}}\n</style>'''
              marker_pos = text.find('</head>')
              if marker_pos < 0:
                  raise SystemExit('Could not find </head>')
              text = text[:marker_pos] + style + '\n' + text[marker_pos:]

          path.write_text(text, encoding='utf-8')

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(auth): make login guard authoritative'
          git push
