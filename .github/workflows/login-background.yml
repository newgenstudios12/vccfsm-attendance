name: Apply VCCF login background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover known-good application shell and repair login flow
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          path = Path('public/index.html')
          base = '1a270357b6c34c742c264126dfbc8f0e307d3306'
          text = subprocess.check_output(['git','show',f'{base}:public/index.html'], text=True)

          old_login = '''$("loginForm").onsubmit=async e=>{e.preventDefault();try{const {error}=await supabaseClient.auth.signInWithPassword({email:$("loginUser").value.trim(),password:$("loginPass").value});if(error)throw error;await loadDb();if(!session)throw new Error("Your account has no VCCF profile yet. An administrator must assign your role.");$("login").style.display="none";$("app").classList.add("active");$("currentName").textContent=session.name;$("currentRole").textContent=session.role+(session.area?" · "+session.area:"");$("avatar").textContent=session.name[0];$("accountInfo").textContent=session.name+" · "+session.role;refresh()}catch(err){toast(err.message||"Unable to sign in.")}};'''
          new_login = '''$("loginForm").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector("button[type=submit],button");button.disabled=true;const originalText=button.textContent;button.textContent="Signing in…";try{if(!SUPABASE_URL||!SUPABASE_KEY)throw new Error("Supabase configuration is missing.");const raw=$("loginUser").value.trim().toLowerCase(),password=$("loginPass").value;if(!raw||!password)throw new Error("Please enter your username/email and password.");const email=raw.includes("@")?raw:(raw.replace(/[^a-z0-9._-]/g,"").replace(/^[-_.]+|[-_.]+$/g,"")+"@vccf.local");if(!email||email==="@vccf.local")throw new Error("Please enter a valid username or email.");const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);let authBody;try{const response=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password}),signal:controller.signal});let body={};try{body=await response.json()}catch{}if(!response.ok)throw new Error(body.error_description||body.msg||body.message||"Invalid username/email or password.");if(!body.access_token||!body.refresh_token||!body.user)throw new Error("Authentication returned an incomplete session.");authBody=body}catch(err){if(err?.name==="AbortError")throw new Error("Sign-in request timed out. Please check your connection and try again.");throw err}finally{clearTimeout(timer)}const {error:setError}=await Promise.race([supabaseClient.auth.setSession({access_token:authBody.access_token,refresh_token:authBody.refresh_token}).then(x=>x),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Session setup timed out. Please try again.")),8000))]);if(setError)throw setError;session={username:email,name:authBody.user.user_metadata?.display_name||authBody.user.email||raw,role:"Member",area:"",areaId:null,memberId:null,memberCode:null};$("login").style.display="none";$("app").classList.add("active");$("currentName").textContent=session.name;$("currentRole").textContent="Member";$("avatar").textContent=session.name[0];$("accountInfo").textContent=session.name+" · Member";toast("Signed in. Loading your VCCF data…");setTimeout(async()=>{try{await Promise.race([loadDb(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("VCCF data is taking too long to load.")),10000))]);if(session){$("currentName").textContent=session.name;$("currentRole").textContent=session.role+(session.area?" · "+session.area:"");$("avatar").textContent=session.name[0];$("accountInfo").textContent=session.name+" · "+session.role;refresh()}}catch(err){console.error("Post-login data load failed:",err);toast(err.message||"Unable to load your VCCF data.")}},0)}catch(err){console.error("VCCF login:",err);toast(err.message||"Unable to sign in.")}finally{button.disabled=false;button.textContent=originalText}};'''
          if old_login not in text:
              raise SystemExit('Known-good login handler not found')
          text = text.replace(old_login,new_login)

          old_restore = '''(async()=>{try{if(!SUPABASE_URL||!SUPABASE_KEY){toast("Supabase configuration is missing.");return}const {data}=await supabaseClient.auth.getSession();if(data.session){await loadDb();if(session){$("login").style.display="none";$("app").classList.add("active");$("currentName").textContent=session.name;$("currentRole").textContent=session.role+(session.area?" · "+session.area:"");$("avatar").textContent=session.name[0];$("accountInfo").textContent=session.name+" · "+session.role;refresh()}}}catch(e){console.error(e)}})();'''
          new_restore = '''(async()=>{try{if(!SUPABASE_URL||!SUPABASE_KEY){toast("Supabase configuration is missing.");return}const {data}=await supabaseClient.auth.getSession();if(data.session){await Promise.race([loadDb(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Session data load timed out.")),10000))]);if(session){$("login").style.display="none";$("app").classList.add("active");$("currentName").textContent=session.name;$("currentRole").textContent=session.role+(session.area?" · "+session.area:"");$("avatar").textContent=session.name[0];$("accountInfo").textContent=session.name+" · "+session.role;refresh()}}}catch(e){console.error("Session restore failed:",e);await supabaseClient.auth.signOut()}})();'''
          if old_restore not in text:
              raise SystemExit('Known-good session restore block not found')
          text = text.replace(old_restore,new_restore)
          path.write_text(text,encoding='utf-8')

      - name: Add login background
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'VCCF_LOGIN_BACKGROUND_V1'
          if marker not in text:
              style = '''<style id="VCCF_LOGIN_BACKGROUND_V1">
.login{background:linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,.16)),url('/Churchfront_login.png') center center/cover no-repeat;}
[data-theme="dark"] .login{background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)),url('/Churchfront_login.png') center center/cover no-repeat;}
.login-card{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
@media(max-width:600px){.login{background-position:center center;background-attachment:scroll;padding:16px;}.login-card{width:100%;padding:24px;border-radius:22px;}}
</style>'''
              marker_pos=text.find('</head>')
              if marker_pos<0: raise SystemExit('Could not find </head>')
              path.write_text(text[:marker_pos]+style+'\n'+text[marker_pos:],encoding='utf-8')

      - name: Commit repaired application
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(auth): use bounded direct Supabase password flow'
          git push
