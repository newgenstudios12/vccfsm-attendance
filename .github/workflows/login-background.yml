name: Apply VCCF login background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover known-good application shell and repair login flow
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          path = Path('public/index.html')
          base = '1a270357b6c34c742c264126dfbc8f0e307d3306'
          text = subprocess.check_output(['git','show',f'{base}:public/index.html'], text=True)

          old_login = '''$("loginForm").onsubmit=async e=>{e.preventDefault();try{const {error}=await supabaseClient.auth.signInWithPassword({email:$("loginUser").value.trim(),password:$("loginPass").value});if(error)throw error;await loadDb();if(!session)throw new Error("Your account has no VCCF profile yet. An administrator must assign your role.");$("login").style.display="none";$("app").classList.add("active");$("currentName").textContent=session.name;$("currentRole").textContent=session.role+(session.area?" · "+session.area:"");$("avatar").textContent=session.name[0];$("accountInfo").textContent=session.name+" · "+session.role;refresh()}catch(err){toast(err.message||"Unable to sign in.")}};'''
          new_login = '''$("loginForm").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector("button[type=submit],button");button.disabled=true;const originalText=button.textContent;button.textContent="Signing in…";try{if(!SUPABASE_URL||!SUPABASE_KEY)throw new Error("Supabase configuration is missing.");const {data,error}=await supabaseClient.auth.signInWithPassword({email:$("loginUser").value.trim(),password:$("loginPass").value});if(error)throw error;if(!data?.session)throw new Error("Sign-in did not create a session.");$("login").style.display="none";$("app").classList.add("active");toast("Signed in. Loading your VCCF data…");try{await Promise.race([loadDb(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("VCCF data is taking too long to load.")),10000))]);if(!session)throw new Error("Your account has no VCCF profile yet. An administrator must assign your role.");$("currentName").textContent=session.name;$("currentRole").textContent=session.role+(session.area?" · "+session.area:"");$("avatar").textContent=session.name[0];$("accountInfo").textContent=session.name+" · "+session.role;refresh()}catch(loadErr){console.error("Post-login data load failed:",loadErr);await supabaseClient.auth.signOut();session=null;profile=null;$("app").classList.remove("active");$("login").style.display="grid";toast(loadErr.message||"Unable to load your VCCF profile.")} }catch(err){toast(err.message||"Unable to sign in.")}finally{button.disabled=false;button.textContent=originalText}};'''
          if old_login not in text:
              raise SystemExit('Known-good login handler not found')
          text = text.replace(old_login,new_login)

          old_restore = '''(async()=>{try{if(!SUPABASE_URL||!SUPABASE_KEY){toast("Supabase configuration is missing.");return}const {data}=await supabaseClient.auth.getSession();if(data.session){await loadDb();if(session){$("login").style.display="none";$("app").classList.add("active");$("currentName").textContent=session.name;$("currentRole").textContent=session.role+(session.area?" · "+session.area:"");$("avatar").textContent=session.name[0];$("accountInfo").textContent=session.name+" · "+session.role;refresh()}}}catch(e){console.error(e)}})();'''
          new_restore = '''(async()=>{try{if(!SUPABASE_URL||!SUPABASE_KEY){toast("Supabase configuration is missing.");return}const {data}=await supabaseClient.auth.getSession();if(data.session){await Promise.race([loadDb(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Session data load timed out.")),10000))]);if(session){$("login").style.display="none";$("app").classList.add("active");$("currentName").textContent=session.name;$("currentRole").textContent=session.role+(session.area?" · "+session.area:"");$("avatar").textContent=session.name[0];$("accountInfo").textContent=session.name+" · "+session.role;refresh()}}}catch(e){console.error("Session restore failed:",e);await supabaseClient.auth.signOut()}})();'''
          if old_restore not in text:
              raise SystemExit('Known-good session restore block not found')
          text = text.replace(old_restore,new_restore)
          path.write_text(text,encoding='utf-8')

      - name: Add login background
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'VCCF_LOGIN_BACKGROUND_V1'
          if marker not in text:
              style = '''<style id="VCCF_LOGIN_BACKGROUND_V1">
.login{background:linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,.16)),url('/Churchfront_login.png') center center/cover no-repeat;}
[data-theme="dark"] .login{background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)),url('/Churchfront_login.png') center center/cover no-repeat;}
.login-card{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
@media(max-width:600px){.login{background-position:center center;background-attachment:scroll;padding:16px;}.login-card{width:100%;padding:24px;border-radius:22px;}}
</style>'''
              marker_pos=text.find('</head>')
              if marker_pos<0: raise SystemExit('Could not find </head>')
              path.write_text(text[:marker_pos]+style+'\n'+text[marker_pos:],encoding='utf-8')

      - name: Commit repaired application
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(auth): restore shell and prevent sign-in blocking [login-repaired]'
          git push
