name: Install VCCF birthday feature

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add birthday feature script to index
        shell: python
        run: |
          from pathlib import Path
          path=Path('public/index.html')
          text=path.read_text(encoding='utf-8')
          marker='<!-- VCCF_BIRTHDAY_FEATURE_V1 -->'
          tag='<script src="/vccf-birthday-feature.js"></script>'
          if marker in text:
              print('Birthday feature already installed.')
          else:
              needle='</body>'
              insert=f'{marker}\\n{tag}\\n'
              if needle not in text: raise SystemExit('Could not locate </body>')
              text=text.replace(needle,insert+needle,1)
              path.write_text(text,encoding='utf-8')

      - name: Commit installation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: install birthday dashboard feature'
          git push
