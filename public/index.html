<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>VCCF Santa Maria | Church Management</title>
  <link rel="icon" href="vccf-logo-black.png">
  <link rel="stylesheet" href="/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/vccf-config.js"></script>
</head>
<body>
  <div id="app">
    <section id="login" class="auth-screen">
      <div class="auth-card">
        <div class="brand-mark">VCCF</div>
        <h1>Church Management</h1>
        <p>Attendance, members, ministries, events, tithes and offerings in one secure system.</p>
        <form id="loginForm">
          <label>Email<input id="email" type="email" autocomplete="email" required></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
          <button class="primary" type="submit">Sign in</button>
          <div id="loginError" class="error"></div>
        </form>
      </div>
    </section>

    <div id="shell" class="hidden">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand"><div class="brand-mark small">VCCF</div><div><b>Santa Maria</b><span>Church Management</span></div></div>
        <nav id="nav">
          <button data-view="dashboard" class="nav-item active">⌂ <span>Dashboard</span></button>
          <button data-view="attendance" class="nav-item">✓ <span>Attendance</span></button>
          <button data-view="members" class="nav-item">♙ <span>Members</span></button>
          <button data-view="giving" class="nav-item">₱ <span>Tithes & Offerings</span></button>
          <button data-view="ministries" class="nav-item">✦ <span>Ministries</span></button>
          <button data-view="events" class="nav-item">▣ <span>Events</span></button>
          <button data-view="pastoral" class="nav-item">♡ <span>Pastoral Care</span></button>
          <button data-view="reports" class="nav-item">▤ <span>Reports</span></button>
        </nav>
        <div class="sidebar-bottom"><div id="userBadge"></div><button id="logout" class="nav-item">⇥ <span>Sign out</span></button></div>
      </aside>
      <main class="main">
        <header class="topbar"><button id="menu" class="icon-btn">☰</button><div><div id="pageTitle" class="page-title">Dashboard</div><div id="pageSub" class="page-sub">Church overview</div></div><div class="top-user" id="topUser"></div></header>
        <div id="content" class="content"></div>
      </main>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn">×</button></div><div id="modalBody"></div></div></div>
  <script src="/app.js"></script>
</body>
</html>
